<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHFTSPDD — Hard Techno · North West UK</title>
    <meta
      name="description"
      content="SHFTSPDD — hard techno DJ/producer duo from North West UK. Stream tracks and get in touch for bookings."
    />
    <meta property="og:title" content="SHFTSPDD" />
    <meta property="og:description" content="Hard techno · DJ/Producers · North West UK" />
    <meta property="og:image" content="assets/logo.jpg" />
    <meta property="og:url" content="https://soundcloud.com/shftspdd" />
    <link rel="icon" href="assets/logo.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="header">
      <a href="index.html" class="header__logo" aria-label="SHFTSPDD home">
        <span class="logo-frame">
          <img src="assets/logo.jpg" alt="" width="48" height="48" class="logo-frame__img" />
        </span>
        <span class="header__wordmark">SHFTSPDD</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html" aria-current="page">Home</a>
        <a href="music.html">Music</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a
          href="https://soundcloud.com/shftspdd"
          target="_blank"
          rel="noopener noreferrer"
          class="nav__external"
        >
          SoundCloud
        </a>
      </nav>
      <button type="button" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
        <span></span>
        <span></span>
      </button>
    </header>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile" hidden>
      <a href="index.html" aria-current="page">Home</a>
      <a href="music.html">Music</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="https://soundcloud.com/shftspdd" target="_blank" rel="noopener noreferrer">SoundCloud</a>
    </nav>

    <main>
      <section class="hero hero--warp" aria-label="SHFTSPDD">
        <canvas id="warp-canvas" class="warp-canvas" aria-hidden="true"></canvas>
        <div class="hero__vignette" aria-hidden="true"></div>

        <h1 class="visually-hidden">SHFTSPDD</h1>
        <div class="hero-logo-anchor">
          <div class="hero-logo" id="hero-logo">
            <img
              src="assets/logo-white.png"
              alt="SHFTSPDD"
              width="560"
              height="560"
              class="hero-logo__img"
            />
          </div>
        </div>

        <div class="hero__copy">
          <p class="hero__shift-meter" id="shift-meter" aria-hidden="true">
            <span class="hero__shift-label">SHIFTING SPEED</span>
            <span class="hero__shift-bar"><span class="hero__shift-fill" id="shift-fill"></span></span>
          </p>
          <p class="hero__eyebrow">Hard Techno · DJ/Producers · North West UK</p>
        </div>

        <div class="hero__dock">
          <div class="hero__actions">
            <a href="music.html" class="btn btn--primary">Listen</a>
            <a href="contact.html" class="btn btn--ghost">Bookings</a>
          </div>
          <a href="music.html" class="hero__scroll" aria-label="Go to music page">
            <span class="hero__scroll-line"></span>
          </a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© <span id="year"></span> SHFTSPDD</p>
    </footer>

    <script src="warp.js"></script>
    <script src="script.js"></script>
  </body>
</html>
